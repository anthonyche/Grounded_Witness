# 手动实验入口模板
# 用法：
#   python scripts/run_experiment_bundle.py --config config.yaml
#
# 这份文件现在是“统一实验入口”的默认手动模板。
# 如果你要跨多次运行保持完全同一套 workload，不要只改 target_ratio；
# 请显式设置 target_nodes / graph_positions。
exhaustchase_timeout_sec: 1000
run_name: manual_dblp
dataset: dblp
model_name: gcn1
methods:
  # - ApxC
  # - HeuC
  # - Exh
  - GEX
  - PGX

# factor 为空时，只跑一个默认点。
# 例如：
# factor_name: sigma_size
# factor_values: [10, 20, 30, 40, 50]
factor_name: ""
factor_values: []

output_root: outputs/raw/bundles
reuse_observed_graph_cache: true

# ===== 主链默认参数 =====
random_seed: 42
sigma_size: 15
local_budget_k: 2
L: 1
gamma: 1
alpha: 0.5
beta: 0.5
incompleteness: 0.05
target_ratio: 0.01
heuchase_m: 10
K : 6  #window size

# ===== workload 固定策略 =====
# 推荐：
# 1. 手动实验优先用显式 target_nodes / graph_positions，避免跨次运行重采样。
# 2. 若留空，则 bundle 会按当前 config 采样一次 workload，并在同一次 bundle 中让所有方法共享。

# DBLP: 固定 30 个 regression workloads
