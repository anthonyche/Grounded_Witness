# ===== 可选覆盖项 =====
# 这些字段会直接覆盖 dataset/default config
constraint_source: mined
constraint_rule_mode: standard_backchase
constraint_filter_target_matchability: true
constraint_pool_mode: original
# 可选：
#   - original
#   - balanced
#   - coverage_only
# 如需手动指定固定规则名单，可再加：
# constraint_pool_file: configs/constraint_pools/dblp_balanced_p7_t0p4.yaml
preserve_connectivity: true
max_masks: 1

# 如果想临时限制方法集合，就注释 methods 里的项；
# 不要在同一 config 里混用 target_nodes 和 graph_positions。
