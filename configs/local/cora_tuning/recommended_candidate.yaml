name: cora_tuning_recommended_candidate
description: Candidate configuration combining finer pseudo-types with a slightly wider bounded search.
overrides:
  constraint_source: hybrid
  constraint_type_source: pseudo_type_degree_combo
  n_node_types: 12
  pseudo_cluster_types: 12
  pseudo_degree_buckets: 4
  apx_seed_per_constraint: 3
  apx_candidate_branch_factor: 4
  apx_candidate_beam_width: 8
  apx_candidate_max_masks: 64
  apx_ranking_pool_factor: 4
