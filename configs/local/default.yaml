defaults:
  random_seed: 42
  K: 6
  local_budget_k: 2
  L: 2
  alpha: 0.5
  beta: 0.5
  gamma: 1.0
  incompleteness: 0.05
  target_ratio: 0.01
  target_sampling_strategy: balanced_lhop
  target_size_percentile_cap: 0.75
  sigma_size: 20
  constraint_source: mined
  constraint_type_source: pseudo_type
  constraint_rule_mode: standard_backchase
  n_node_types: 8
  constraint_templates:
    - triangle
    - extension
  constraint_min_support: 2
  constraint_min_confidence: 0.6
  constraint_mining_hops: 2
  constraint_mining_max_samples: 64
  constraint_max_patterns: 50
  baseline_edge_topk: 6
  preserve_connectivity: true
  max_masks: 3
  apx_use_ranked_candidate_prioritization: true
  apx_use_task_aware_hybrid_generation: false
  apx_seed_per_constraint: 2
  apx_candidate_expand_steps: 2
  apx_candidate_branch_factor: 3
  apx_candidate_beam_width: 6
  apx_candidate_max_masks: 48
  apx_legacy_prefix_checkpoints: 6
  apx_ranking_pool_factor: 3
  apx_ranking_diversity_bonus: 0.2
  apx_max_near_full_candidates: 16
  apx_near_full_delete_budget: 3
  apx_near_full_branch_factor: 6
  apx_near_full_beam_width: 4
  apx_large_graph_fast_mode: true
  apx_large_graph_node_threshold: 2500
  apx_large_graph_edge_threshold: 8000
  apx_large_graph_seed_per_constraint: 4
  apx_large_graph_candidate_expand_steps: 0
  apx_large_graph_candidate_branch_factor: 2
  apx_large_graph_candidate_beam_width: 4
  apx_large_graph_candidate_max_masks: 16
  apx_large_graph_max_consequent_matches_per_constraint: 8
  apx_large_graph_stream_max_candidates: 128
  apx_large_graph_disable_ranked_prioritization: true
  apx_large_graph_disable_task_aware_hybrid: true
  apx_large_graph_disable_full_mask_prune: true
  apx_large_graph_disable_legacy_prefix: true
  heuchase_m: 20
  heuchase_noise_std: 0.2
  hidden_dim: 32
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
